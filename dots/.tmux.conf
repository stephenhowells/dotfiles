# ~/.tmux.conf — Bluloco Light
# Requires tmux >= 3.2 (config variables, terminal-features, copy-mode match styles)

# ----------------------------------------------------------------------------
# Prefix
# ----------------------------------------------------------------------------
unbind C-b
set -g prefix C-s
bind -r C-s send-prefix

bind r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

# ----------------------------------------------------------------------------
# Terminal capabilities
# ----------------------------------------------------------------------------
set -g default-terminal "tmux-256color"

# True color in any outer terminal that supports it (Ghostty's TERM is
# xterm-ghostty, so an override scoped to xterm-256color never matched)
set -as terminal-features "*:RGB"

# Undercurl + undercurl colors (Neovim diagnostics)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# ----------------------------------------------------------------------------
# Core behavior
# ----------------------------------------------------------------------------
set -s escape-time 0            # no delay after Esc (vim mode switching)
set -g focus-events on          # Neovim autoread / gitgutter need this
set -g history-limit 50000      # default is a comically small 2,000 lines
set -g mouse on
set -g set-clipboard on         # OSC 52 — clipboard works over SSH too
set -g status-keys emacs        # readline bindings at the : prompt
set -g display-panes-time 4000  # default 1s isn't enough to read pane numbers
set -g set-titles on
set -g set-titles-string "#S / #W"

set -g base-index 1
setw -g pane-base-index 1       # panes count from 1, same as windows
set -g renumber-windows on
set -g detach-on-destroy off    # killing a session lands you in the next one

# ----------------------------------------------------------------------------
# Splits, windows, resizing
# ----------------------------------------------------------------------------
bind - split-window -v -c '#{pane_current_path}'
bind \\ split-window -h -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'

# Fine / coarse resizing without the prefix.
# NOTE: macOS claims C-Left/C-Right for Spaces by default (System Settings >
# Keyboard > Keyboard Shortcuts > Mission Control), so those two may never
# reach tmux unless you uncheck them there.
bind -n S-Left  resize-pane -L 2
bind -n S-Right resize-pane -R 2
bind -n S-Down  resize-pane -D 1
bind -n S-Up    resize-pane -U 1
bind -n C-Left  resize-pane -L 10
bind -n C-Right resize-pane -R 10
bind -n C-Down  resize-pane -D 5
bind -n C-Up    resize-pane -U 5

# Repeatable resize under the prefix: C-s once, then tap arrows
bind -r Left  resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Down  resize-pane -D 3
bind -r Up    resize-pane -U 3

# ----------------------------------------------------------------------------
# vim-tmux-navigator
# ----------------------------------------------------------------------------
is_vim='echo "#{pane_current_command}" | grep -iqE "(^|\/)g?(view|n?vim?x?)(diff)?$"'
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'
bind C-l send-keys C-l          # clear screen lives under the prefix

# ----------------------------------------------------------------------------
# Copy mode (vi)
# ----------------------------------------------------------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel pbcopy
unbind -T copy-mode-vi Enter
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel pbcopy
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel pbcopy

# ----------------------------------------------------------------------------
# Session / pane workflow
# ----------------------------------------------------------------------------
bind b break-pane -d
bind C-b send-keys 'tat && exit' 'C-m'
bind h split-window -h "htop"
bind w split-window -h -c ~/my-wiki "vim +CtrlP"
bind C-j split-window -v "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"
bind j command-prompt -p "join pane from: " "join-pane -h -s '%%'"
bind s display-panes \; command-prompt -p "pane #: " "swap-pane -t '%%'"
bind a choose-session
bind K run-shell 'tmux switch-client -n \; kill-session -t "$(tmux display-message -p "#S")" || tmux kill-session'
bind -r F new-window t
bind -r D run-shell "t ~/.dotfiles"

# ----------------------------------------------------------------------------
# Theme — Bluloco Light
# tmux only paints its own chrome (status bar, borders, copy mode, menus).
# Pane contents take their colors from Ghostty: theme = Bluloco Light
# ----------------------------------------------------------------------------
bl_bg="#f9f9f9"       # terminal background
bl_fg="#373a41"       # foreground
bl_grey="#babbc2"     # ANSI 7
bl_dim="#676a77"      # ANSI 8
bl_blue="#275fe4"     # ANSI 4
bl_red="#d52753"      # ANSI 1
bl_green="#23974a"    # ANSI 2
bl_orange="#df631c"   # ANSI 3
bl_purple="#823ff1"   # ANSI 5
bl_sel="#daf0ff"      # selection background

set -g status-left-length 50
set -g status-right-length 60
set -g status-style "fg=$bl_dim,bg=default"

# Slant caps  (U+E0BE) /  (U+E0B8) are Nerd Font glyphs;
# swap in  (U+E0BA) /  (U+E0BC) to flip the lean direction.
set -g status-left "#[fg=$bl_sel,bg=default]#[fg=$bl_fg,bg=$bl_sel] #S #[fg=$bl_sel,bg=default]"
set -g status-right "#[fg=$bl_sel,bg=default]#[fg=$bl_fg,bg=$bl_sel] #(battery -p -t -a)#[fg=$bl_fg,bg=$bl_sel] %m/%d %I:%M #[fg=$bl_sel,bg=default]"

set -g window-status-format " #I: #W "
set -g window-status-style "fg=$bl_dim"
set -g window-status-current-format "#[fg=$bl_blue,bg=default]#[fg=$bl_bg,bg=$bl_blue] #I: #W #[fg=$bl_blue,bg=default]"
set -g window-status-current-style "default"
set -g window-status-activity-style "fg=$bl_orange"
set -g window-status-bell-style "fg=$bl_red"

set -g pane-border-style "fg=$bl_grey"
set -g pane-active-border-style "fg=$bl_blue"

set -g message-style "fg=$bl_fg,bg=$bl_sel"
set -g message-command-style "fg=$bl_bg,bg=$bl_dim"
set -g mode-style "fg=$bl_fg,bg=$bl_sel"

set -g copy-mode-match-style "fg=$bl_fg,bg=$bl_grey"
set -g copy-mode-current-match-style "fg=$bl_bg,bg=$bl_orange"

set -g clock-mode-colour "$bl_blue"
set -g display-panes-colour "$bl_dim"
set -g display-panes-active-colour "$bl_blue"
